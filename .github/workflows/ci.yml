name: Enterprise CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-checks:
    name: "Pre-Receive Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Uncomment these when linting constraints are added to the repo
      # - name: Run ESLint
      #   working-directory: ./frontend
      #   run: |
      #     npm ci
      #     npm run lint

      # - name: Run Flake8 (Python)
      #   working-directory: ./backend
      #   run: |
      #     pip install flake8
      #     flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  integration-tests:
    name: "Ephemeral Regression Testing"
    needs: static-checks
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 1. Boot Backend
      # ----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Start FastAPI Backend (Background)
        working-directory: ./backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 10 # Wait for Uvicorn to boot

      # ----------------------------------------------------------------------
      # 2. Boot Frontend & E2E Testing
      # ----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build

      - name: Start Next.js Server (Background)
        working-directory: ./frontend
        run: |
          npm run start &
          sleep 10 # Wait for Next.js to boot

      - name: Run Cypress E2E Test Suite
        working-directory: ./frontend
        run: npx cypress run --spec "cypress/e2e/decision_studio.cy.js"

      - name: Upload Cypress Evidence Artifacts (Failure Traces)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7
