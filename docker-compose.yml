version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=intelli_credit_neo4j
    env_file:
      - ./backend/.env
    command: uvicorn main:app --host 0.0.0.0 --port 8006 --reload
    depends_on:
      - neo4j
    networks:
      - intelli-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8006
    depends_on:
      - backend
    networks:
      - intelli-net

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/intelli_credit_neo4j
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - intelli-net

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  intelli-net:
    driver: bridge
